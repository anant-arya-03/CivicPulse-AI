[project]
name = "civicpulse-backend"
version = "0.1.0"
description = "CivicPulse AI backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.16,<3",
    "email-validator>=2.3,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pillow>=13,<14",             # image validation and metadata stripping
    "python-multipart>=0.0.33",   # file uploads (multipart/form-data)
    "anthropic>=2.4,<3",          # official Claude SDK (only used when AI_PROVIDER=anthropic)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16,<3",  # HTTP client used by FastAPI's TestClient
    "ruff>=0.17,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]  # autogenerated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in default arguments is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package
